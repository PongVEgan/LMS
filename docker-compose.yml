# ตรึงชื่อ project ไว้ — ปกติ Docker ตั้งชื่อตามชื่อโฟลเดอร์ ซึ่งทำให้เปลี่ยนชื่อโฟลเดอร์
# เมื่อไหร่ volume จะกลายเป็นตัวใหม่ว่างเปล่า และข้อมูลในฐานข้อมูลจะหายทั้งหมด
# ตรึงไว้แบบนี้แล้วเปลี่ยนชื่อ/ย้ายโฟลเดอร์ได้อย่างปลอดภัย
name: winwin-learn-nextjs

services:
  db:
    image: postgres:17-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    # ใช้ 5433 ฝั่ง host กัน Postgres ตัวอื่นในเครื่องชนพอร์ต
    ports:
      - "5433:5432"
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  # หน้าเว็บดู/แก้ฐานข้อมูล — เปิด http://localhost:8080 ได้เลย ไม่ต้องติดตั้งโปรแกรมเพิ่ม
  # ใช้ตอนนำเสนอเพื่อโชว์ตารางและข้อมูลจริง
  adminer:
    image: adminer:5
    container_name: lms-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # เติมชื่อเซิร์ฟเวอร์ให้อัตโนมัติ เหลือแค่กรอก lms / lms ตอนเข้า
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha

volumes:
  lms-pgdata:
